name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') } else { $v = '0.0.0-dev' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish the app
        run: dotnet publish src/TrackpadCompanion.csproj -c Release -r win-x64 -o publish

      - name: Remove unused language folders
        shell: pwsh
        run: ./scripts/prune-languages.ps1 -Path publish

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer\TrackpadCompanion.iss'

      - name: Make the portable zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath "dist\TrackpadCompanion-portable-${{ steps.ver.outputs.version }}-win-x64.zip"

      - name: Show file sizes
        shell: pwsh
        run: Get-ChildItem dist | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: TrackpadCompanion-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Publish a GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
